# Secret przechowuje wrażliwe dane jak klucze API.
# WAŻNE: Ten plik NIE powinien trafić do repozytorium z prawdziwym kluczem!
# Wartości muszą być zakodowane w base64.
#
# Jak zakodować klucz API do base64 w PowerShell:
# [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("twoj_klucz_api"))
#
# Podstaw swój klucz Groq w polu groq-api-key.
apiVersion: v1
kind: Secret
metadata:
  name: faktury-secret
  namespace: faktury
type: Opaque
data:
  # Wygeneruj base64 w PowerShell:
  # [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("twoj_klucz_groq"))
  groq-api-key: "TUTAJ_WSTAW_KLUCZ_W_BASE64"